
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- Open as standalone app on iPad -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Geneva Bus Board">

  <meta name="theme-color" content="#101820">

  <title>Geneva Bus Board</title>

  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #101820;
      color: white;
      font-family: Arial, sans-serif;
    }

    body {
      text-align: center;
      padding: 40px;
      box-sizing: border-box;
    }

    h1 {
      color: #f3bb45;
    }

    #clock {
      font-size: 64px;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <h1>Geneva Bus Board</h1>
  <p>My first website!</p>
  <p id="clock"></p>

  <script>
    function updateClock() {
      const now = new Date();

      document.getElementById("clock").textContent =
        now.toLocaleTimeString("fr-CH", {
          timeZone: "Europe/Zurich",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit"
        });
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
