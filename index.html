<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Geneva Bus Board">

  <meta name="theme-color" content="#000000">

  <title>Geneva Bus Board</title>

  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #000000;
      color: white;
      font-family: Arial, sans-serif;
    }

body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding-inline: 160px;
}

    .bus-row {
        display:flex;
        align-items: center;
        gap:40px;
    }

    .bus-number-5 {
        color:black;
        background: lightskyblue;
        font-size:72px;
        padding: 2px 15px;
    }

    .bus-number-8 {
        color:white;
        background: #84471C;
        font-size:72px;
        padding: 2px 15px;
    }


    .bus-number-11 {
        color:white;
        background: #82419E;
        font-size:72px;
        padding: 2px;
        padding-left:1.5px;
        padding-right:5.1px;
    letter-spacing: -0.08em;
    }

    .bus-description {
        display: flex;
        flex-direction: column;
        gap:4px;
        color: orange;
        font-size:37px;
    }

    .minutes {
        display: flex;
        flex-direction: column;
        gap:4px;
        color: orange;
        font-size:37px;
        text-align: right;
        margin-left: auto;
    }
    
.stops {
    display: flex;
    flex-direction: column;
    gap: 20px;
    width: max-content;
    margin-inline: auto;
}

    .bus-row:nth-child(3) {
    margin-bottom: 50px;
    }

  @media (orientation: portrait) and (min-width: 740px) and (min-height: 800px) {
    .stops {
        transform: scale(1.6);
    }
}
  </style>
</head>

<body>


<div class="stops">

<div class="bus-row">
    <span class="bus-number-5">5</span> 
    <div class ="bus-description">
        <span>Thônex  </span> 
        <span>Thônex  </span>
    </div>
    <div class ="minutes">
        <span id="time-thonex-1"> 3 min</span> 
        <span id="time-thonex-2">12 min</span> 
    </div>
</div>


<div class="bus-row">
    <span class="bus-number-8">8</span> 
    <div class ="bus-description">
        <span>Veyrier  </span> 
        <span>Veyrier  </span>
    </div>
    <div class ="minutes">
        <span id="time-veyrier-1"> 3 min</span> 
        <span id="time-veyrier-2">12 min</span> 
    </div>
</div>


<div class="bus-row">
    <span class="bus-number-11">11</span> 
    <div class ="bus-description">
        <span>Eaux-Vives  </span> 
        <span>Eaux-Vives  </span>
    </div>
    <div class ="minutes">
        <span id="time-eaux-1"> 3 min</span> 
        <span id="time-eaux-2">12 min</span> 
    </div>
</div>

<div class="bus-row">
    <span class="bus-number-5">5</span> 
    <div class ="bus-description">
        <span>Aéroport  </span> 
        <span>Aéroport  </span>
    </div>
    <div class ="minutes">
        <span id="time-aeroport-1"> 3 min</span> 
        <span id="time-aeroport-2">12 min</span> 
    </div>
</div>

</div>


</html>
