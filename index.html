<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Geneva Bus Board">
  <meta name="theme-color" content="#101112">
  <title>Geneva Bus Board</title>
  <link rel="stylesheet" href="./board.css">
  <script src="./departures.js" defer></script>
  <script src="./weather.js" defer></script>
</head>
<body>
  <main class="screen" aria-label="Geneva departures and weather">
    <section class="stops" aria-label="Upcoming departures">
      <div class="bus-row">
        <span class="bus-number-5">5</span>
        <div class="bus-description"><span>Thônex</span><span>Thônex</span></div>
        <div class="minutes">
          <span id="time-thonex-1">—</span>
          <span id="time-thonex-2">—</span>
        </div>
      </div>
      <div class="bus-row">
        <span class="bus-number-8">8</span>
        <div class="bus-description"><span>Veyrier</span><span>Veyrier</span></div>
        <div class="minutes">
          <span id="time-veyrier-1">—</span>
          <span id="time-veyrier-2">—</span>
        </div>
      </div>
      <div class="bus-row">
        <span class="bus-number-11">11</span>
        <div class="bus-description"><span>Eaux-Vives</span><span>Eaux-Vives</span></div>
        <div class="minutes">
          <span id="time-eaux-1">—</span>
          <span id="time-eaux-2">—</span>
        </div>
      </div>
      <div class="bus-row">
        <span class="bus-number-5">5</span>
        <div class="bus-description"><span>Aéroport</span><span>Aéroport</span></div>
        <div class="minutes">
          <span id="time-aeroport-1">—</span>
          <span id="time-aeroport-2">—</span>
        </div>
      </div>
    </section>
    <footer class="weather" aria-label="Geneva weather">
      <span id="temperature">— °C</span>
      <span class="feels">Feels like <span id="feels-like">— °C</span></span>
      <a id="forecast" href="https://open-meteo.com/" title="Next-hour forecast by Open-Meteo">—</a>
    </footer>
  </main>
</body>
</html>
